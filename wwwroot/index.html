<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Дела</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%23FF48B0'/%3E%3Ccircle cx='19' cy='17' r='9' fill='%232F5BEA' fill-opacity='.85'/%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Onest:wght@400;500;700&family=Unbounded:wght@600;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <main class="page">

    <header class="top">
      <div>
        <h1 class="logo" aria-label="Дела">
          <span class="layer ink">Дела</span>
          <span class="layer pink" aria-hidden="true">Дела</span>
          <span class="layer blue" aria-hidden="true">Дела</span>
        </h1>
        <p class="summary" id="summary" aria-live="polite">Загружаю доску…</p>
      </div>

      <label class="search">
        <span class="visually-hidden">Поиск по делам</span>
        <input id="search" type="search" placeholder="Найти дело" autocomplete="off">
      </label>
    </header>

    <form class="add" id="add-form" autocomplete="off">
      <label class="add-title">
        <span class="visually-hidden">Название дела</span>
        <input name="title" type="text" maxlength="120" required placeholder="Что нужно сделать?">
      </label>

      <fieldset class="prio-pick">
        <legend class="visually-hidden">Срочность</legend>
        <label><input type="radio" name="priority" value="Low"><span>не горит</span></label>
        <label><input type="radio" name="priority" value="Medium" checked><span>обычно</span></label>
        <label><input type="radio" name="priority" value="High"><span>срочно</span></label>
      </fieldset>

      <label class="add-date">
        <span class="visually-hidden">Срок</span>
        <input name="dueDate" type="date">
      </label>

      <button class="add-btn" type="submit">Добавить дело</button>
    </form>

    <section class="board" aria-label="Доска дел">
      <section class="col col-todo" data-state="Todo">
        <header class="col-head">
          <h2>Надо сделать</h2>
          <span class="count" data-count>0</span>
        </header>
        <ul class="cards"></ul>
      </section>

      <section class="col col-progress" data-state="InProgress">
        <header class="col-head">
          <h2>В работе</h2>
          <span class="count" data-count>0</span>
        </header>
        <ul class="cards"></ul>
      </section>

      <section class="col col-done" data-state="Done">
        <header class="col-head">
          <h2>Готово</h2>
          <span class="count" data-count>0</span>
        </header>
        <ul class="cards"></ul>
      </section>
    </section>

  </main>

  <div class="toast" id="toast" role="status" aria-live="polite"></div>

  <script type="module" src="js/app.js"></script>
</body>
</html>
